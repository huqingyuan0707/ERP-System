# pre-commit 本地开发钩子
#
# 【定位】本地钩子的目标是「提交前秒级反馈」，不是 CI 门禁的复制品。
#   - 只跑快且能自动修复的检查（秒级），避免开发者等待
#   - 只对「本次改动的文件」执行，不做全量扫描
#   - 真正的门禁判定（分级阻断）在 CI 的 code-quality stage 完成
#
# 【安装】
#   pip install pre-commit
#   pre-commit install          # 写入 .git/hooks/pre-commit
#   pre-commit run --all-files  # 首次全量检查
#
# 【重要】pytype 故意没有放进本地钩子，原因有二：
#   1. pytype 官方不支持 Windows（仅支持 Linux/macOS，Windows 需 WSL），
#      而本项目主要开发机是 Windows；
#   2. pytype 需要 Python 3.8~3.12 解释器，而本地 venv 往往是 3.13+，
#      且 pytype 单次全量分析耗时以分钟计，不适合放进提交钩子。
#   => pytype 只在 CI（Linux + Python 3.11）执行，本地需要时用 WSL/Docker 手动跑。

minimum_pre_commit_version: "3.0.0"
default_install_hook_types: [pre-commit]

repos:
  # ------------------------------------------------------------------
  # 1. 通用卫生检查：行尾空格、文件末尾换行、合并冲突标记、调试语句残留
  # ------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^backend/alembic/
      - id: end-of-file-fixer
        exclude: ^backend/alembic/
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        exclude: ^backend/alembic/
      # 禁止提交调试残留：print / pdb / breakpoint
      - id: no-commit-to-branch
        args: [--branch, main, "--branch=main"]
        stages: [pre-push]

  # ------------------------------------------------------------------
  # 2. pyink：Google Python Style Guide 格式化（对齐 Google 体系）
  #    修复方式：直接改写文件，提交前自动完成，无需手工整理格式
  # ------------------------------------------------------------------
  - repo: https://github.com/google/pyink
    rev: 26.5.1
    hooks:
      - id: pyink
        # 显式指定配置文件：pyink 只会读取 pyink.toml 的 [tool.pyink] 段，
        # 不会自动发现独立文件，必须用 --config 明确指定。
        args:
          - --config=backend/pyink.toml
          - --preview
        exclude: ^backend/alembic/

  # ------------------------------------------------------------------
  # 3. pylint：语义正确性检查（空引用 / 非法调用 / 参数不匹配）
  #    只在「有改动的 Python 文件」上运行，且只启用错误级检查，
  #    避免本地钩子因为存量告警而卡住提交。
  # ------------------------------------------------------------------
  - repo: https://github.com/PyCQA/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        name: pylint (错误级 · 本地快检)
        args:
          - --rcfile=backend/pylintrc
          # 只看错误级：致命/错误类问题（E、F）才阻断本地提交
          - --disable=all
          - --enable=E
          # 报告里不显示评分，避免「10.00/10」这类噪音
          - --score=n
        # 只检查本次改动的文件，且排除迁移目录
        exclude: ^backend/alembic/
        types_or: [python, pyi]
