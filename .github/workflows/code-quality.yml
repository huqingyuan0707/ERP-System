name: Code Quality

# 代码质量门禁：谷歌体系三件套（pyink / pytype / pylint）
#
# 在流水线中的位置：
#   pre-commit（本地）→ 【本流水线：代码质量门禁】→ AI 代码评审 → SonarQube → SQL 校验 → 单元测试 → 预发部署
#   放在 AI 评审之前的原因：静态检查是确定性的、秒级的，先把「机器能确定发现的问题」
#   挡在前面，避免把带低级错误的代码送去消耗 AI 评审的 token，也避免 AI 评审
#   去重复报告 pylint 已经能报的东西。
#
# 与其它工具的职责划分（避免重复检查）：
#   - ruff        ：快速 lint（import 排序、基础风格），已在 pre-commit 与 CI 中承担
#   - pyink       ：格式化（Google Style），可自动修复，不阻断
#   - pylint      ：语义正确性（空引用、非法调用、参数不匹配），高风险模块强制阻断
#   - pytype      ：类型推断（pytype 独有的数据流类型分析），高风险模块强制阻断
#   - SonarQube   ：复杂度、重复代码、安全漏洞，不在本流水线重复
#   - AI 代码评审 ：业务语义、需求符合度、架构分层，不在本流水线重复

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/ci/**'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/ci/**'
      - '.github/workflows/code-quality.yml'

# 同一 PR 的后续提交取消上一次未完成的运行，避免堆积
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # 上传检查报告到 PR（便于评审者直接查看）
  pull-requests: write

jobs:
  code-quality:
    name: 代码质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # ------------------------------------------------------------------
      # 步骤 1：安装 Python 3.11
      #   必须用 3.11：pytype 只支持 Python 3.8~3.12，且 pytype.cfg 中
      #   配置了 python_version = 3.11，运行解释器版本必须与之匹配，
      #   否则报 "Could not find a valid python3.11 interpreter in path"。
      # ------------------------------------------------------------------
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 质量工具单独安装，与业务依赖解耦，方便后续单独升级
          pip install "pyink==26.5.1" "pylint==4.1.3"

      # ------------------------------------------------------------------
      # 步骤 2：pyink 格式检查（仅告警，不阻断）
      #   格式问题可自动修复，阻断合并会打断开发节奏；
      #   真正需要阻断的是类型错误、空引用、非法调用这类正确性问题。
      #   注意：pyink 不会自动发现独立的 pyink.toml，必须显式 --config，
      #   且该文件必须带 [tool.pyink] 段头（顶层裸键会被静默忽略）。
      # ------------------------------------------------------------------
      - name: pyink 格式检查（仅告警）
        working-directory: ./backend
        continue-on-error: true
        run: |
          pyink --config=pyink.toml --check --diff app || \
            echo "::warning::pyink 格式检查未通过（不阻断合并），请执行 pyink --config=pyink.toml app 自动修复"

      # ------------------------------------------------------------------
      # 步骤 3：安装 pytype 依赖的 libclang
      #   pytype 依赖 libclang 解析源码，缺少它会直接 import 失败。
      # ------------------------------------------------------------------
      - name: 安装 pytype 依赖的 libclang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev

      - name: 安装 pytype
        run: pip install "pytype==2024.10.11"

      # ------------------------------------------------------------------
      # 步骤 4：执行检查 + 门禁分级判定（统一由 quality_scan.py 编排）
      #   为什么不直接调用 quality_gate.py：
      #   门禁脚本要求 --scan-status 来确认「检查确实跑成功」，
      #   缺这个参数会按 fail-closed 语义返回退出码 2（流水线必然失败）。
      #   quality_scan.py 会先真实执行三个工具、落盘 scan-status.json 清单，
      #   再调用 quality_gate.py 做分级判定，退出码语义与脚本约定一致：
      #     0 = 检查完成且无阻断问题
      #     1 = 检查完成但存在阻断问题
      #     2 = 检查过程本身失败（工具崩溃、版本不符、报告缺失）
      # ------------------------------------------------------------------
      - name: 执行检查与门禁判定
        run: |
          python scripts/ci/quality_scan.py \
            --repo-root . \
            --reports backend/reports \
            --tools pyink pylint pytype

      # ------------------------------------------------------------------
      # 步骤 5：把报告作为 PR 评论发布
      #   评审者不必去翻流水线日志即可看到阻断项清单。
      # ------------------------------------------------------------------
      - name: 发布检查报告到 PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'backend/reports/quality/quality-report.md';
            if (!fs.existsSync(reportPath)) {
              core.info('未生成检查报告，跳过评论');
              return;
            }
            const report = fs.readFileSync(reportPath, 'utf8');
            // 报告可能较长，截断到 60000 字符以内（GitHub 评论上限）
            const body = report.length > 60000
              ? report.slice(0, 60000) + '\n\n> 报告过长已截断，完整内容见流水线产物。'
              : report;
            const marker = '<!-- code-quality-report -->';
            const bodyWithMarker = marker + '\n' + body;
            // 删除旧评论后重新发布，避免刷屏
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(c => c.body && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: bodyWithMarker,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: bodyWithMarker,
              });
            }

      # ------------------------------------------------------------------
      # 步骤 6：上传报告产物
      #   供效能看板采集与事后追溯。
      # ------------------------------------------------------------------
      - name: 上传检查报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_id }}
          path: backend/reports/quality/
          retention-days: 30
