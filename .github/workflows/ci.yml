name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Imports must never inherit a developer/production database URL.
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: ""
      SECRET_KEY: isolated-ci-secret-not-for-deployment
      TESTING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import backend
        working-directory: ./backend
        run: python -c "from app.main import app; from app.db.init_db import init_db"

      - name: Run tests with isolated temporary SQLite
        working-directory: ./backend
        run: python -m pytest tests/ -v -m "not postgres"

  postgres:
    # This service creates a fresh erp_test database for every job. PostgreSQL
    # tests also enforce TEST_POSTGRES=1 and a test/CI database suffix.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://erp:change_me@localhost:5432/erp_test
      REDIS_URL: ""
      SECRET_KEY: isolated-ci-secret-not-for-deployment
      TESTING: "1"
      TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Migrate fresh PostgreSQL database
        working-directory: ./backend
        run: alembic upgrade head
      - name: Run PostgreSQL concurrency tests
        working-directory: ./backend
        run: python -m pytest tests/test_postgres_concurrency.py -v -m postgres --noconftest

  db-migration:
    # A separate disposable PostgreSQL service exercises the historical chain;
    # the SQLite unit-test matrix does not claim PostgreSQL coverage.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://erp:change_me@localhost:5432/erp_test
      REDIS_URL: ""
      SECRET_KEY: isolated-ci-secret-not-for-deployment
      TESTING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Initialize empty PostgreSQL through real migrations and seeds
        working-directory: ./backend
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import func, select
          from app.db.init_db import _alembic_head, _current_revision, init_db
          from app.db.session import AsyncSessionLocal, engine
          from app.models.sys import SysConfig, SysDictItem, SysDictType, SysUser

          async def verify():
              try:
                  await init_db()
                  async with engine.connect() as conn:
                      assert await conn.run_sync(_current_revision) == _alembic_head()
                  async with AsyncSessionLocal() as session:
                      for model in (SysConfig, SysDictItem, SysDictType, SysUser):
                          assert await session.scalar(select(func.count()).select_from(model)) > 0
                  await init_db()
              finally:
                  await engine.dispose()

          asyncio.run(verify())
          PY
      - name: Check model and migration schema agree
        working-directory: ./backend
        run: alembic check
      - name: Round-trip the latest revision
        working-directory: ./backend
        run: |
          before="$(alembic current | awk 'NF {print $1; exit}')"
          test -n "$before"
          test "$before" = "$(alembic heads | awk 'NF {print $1; exit}')"
          alembic downgrade -1
          after_downgrade="$(alembic current | awk 'NF {print $1; exit}')"
          test -n "$after_downgrade"
          test "$after_downgrade" != "$before"
          alembic upgrade head
          after_upgrade="$(alembic current | awk 'NF {print $1; exit}')"
          test "$after_upgrade" = "$before"
          alembic check

  backend-lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      REDIS_URL: ""
      SECRET_KEY: isolated-ci-secret-not-for-deployment
      TESTING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and Ruff
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install "ruff==0.16.7"
      - name: Run Ruff on backend and tests
        working-directory: ./backend
        run: python -m ruff check app tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Type-check frontend
        run: pnpm exec vue-tsc --noEmit -p tsconfig.json
      - name: Lint frontend without modifying files
        run: pnpm exec eslint . --ext .ts,.vue --no-fix
      - name: Build frontend
        run: pnpm run build
