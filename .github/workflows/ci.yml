name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 ruff
        run: pip install ruff
      - name: ruff 静态检查
        run: ruff check app tests
      - name: ruff 格式检查（暂不阻断，待历史代码统一后启用）
        continue-on-error: true
        run: ruff format --check app tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: ci_test_pwd
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - '6379:6379'
    env:
      DATABASE_URL: postgresql+asyncpg://erp:ci_test_pwd@localhost:5432/erp_test
      SECRET_KEY: ci-only-secret-key-not-for-production
      REDIS_URL: redis://localhost:6379/0
      TESTING: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖
        run: pip install -r requirements.txt pytest-cov
      - name: 运行测试并生成覆盖率
        run: pytest --cov=app --cov-report=xml --cov-report=term -q
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore