name: Deploy ERP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（默认 latest，也可填 commit SHA）'
        required: false
        default: 'latest'

env:
  # 兼容两种 Secrets 写法（推荐第 1 种，一行写全）：
  #   1) ACR_REGISTRY = <地址>/<命名空间>，例如 crpi-xxxx.cn-beijing.personal.cr.aliyuncs.com/erp
  #   2) ACR_HOST + ACR_NAMESPACE = <地址> + <命名空间>
  # 注意：Secret 的值不能带空格/引号/换行，粘贴时请用「粘贴为纯文本」
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_HOST: ${{ secrets.ACR_HOST }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  ACR_TAG: ${{ github.event.inputs.tag || 'latest' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.acr.outputs.host }}
      namespace: ${{ steps.push-backend.outputs.namespace }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 解析并校验 ACR 配置
        id: acr
        run: |
          set -uo pipefail
          # 清洗复制粘贴可能带入的空白与回车换行（其余非法字符由下方正则校验拦截）
          clean() {
            printf '%s' "$1" | tr -d '[:space:]'
          }
          registry="$(clean "$ACR_REGISTRY")"
          host_raw="$(clean "$ACR_HOST")"
          ns_raw="$(clean "$ACR_NAMESPACE")"
          user="$(clean "$ACR_USERNAME")"

          host=""; ns=""
          if [ -n "$host_raw" ] && [ -n "$ns_raw" ]; then
            host="${host_raw%/}"; ns="${ns_raw#/}"
          elif [ -n "$registry" ]; then
            if [ "${registry#*/}" != "$registry" ]; then
              host="${registry%%/*}"; ns="${registry#*/}"
            else
              host="${registry%/}"
            fi
          fi

          if [ -z "$host" ]; then
            echo "::error::缺少 ACR 配置：请设置 Secret ACR_REGISTRY=<地址>/<命名空间>（或 ACR_HOST + ACR_NAMESPACE）"
            exit 1
          fi
          if ! printf '%s' "$host" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9.-]*$'; then
            echo "::error::ACR 地址不合法（只允许字母数字、点、中划线）。请把 Secret 值改成纯域名，例如 crpi-xxxx.cn-beijing.personal.cr.aliyuncs.com/erp"
            exit 1
          fi
          if [ -n "$ns" ] && ! printf '%s' "$ns" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "::error::命名空间不合法（只允许字母数字、点、下划线、中划线）。请检查 Secret ACR_REGISTRY 中 / 后面的部分"
            exit 1
          fi
          if [ -z "$user" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::缺少 ACR_USERNAME / ACR_PASSWORD（取自 ACR 实例「访问凭证」）"
            exit 1
          fi

          case "${host}" in
            registry.*.aliyuncs.com) : ;;
            *.aliyuncs.com) : ;;
            *) echo "::warning::ACR 地址形如 registry.<区域>.aliyuncs.com，当前长度 ${#host}" ;;
          esac

          # 未配置命名空间时，用 ACR 凭证探测可用命名空间
          candidates="${ns}"
          if [ -z "${candidates}" ]; then
            echo "ACR 配置未包含命名空间，开始自动探测 ..."
            realm="$(curl -sI "https://${host}/v2/" | tr -d '\r' | grep -i '^www-authenticate:' | sed -n 's/.*realm="\([^"]*\)".*/\1/p')"
            if [ -n "${realm}" ]; then
              token="$(curl -s -u "${user}:${ACR_PASSWORD}" "${realm}?service=${host}&scope=registry:catalog:*" | tr ',' '\n' | sed -n 's/.*"token":"\([^"]*\)".*/\1/p' | head -1)"
              if [ -n "${token}" ]; then
                found="$(curl -s -H "Authorization: Bearer ${token}" "https://${host}/v2/_catalog" | tr ',' '\n' | sed -n 's/.*"\([^"]*\/[^"]*\)".*/\1/p' | cut -d/ -f1 | sort -u | tr '\n' ' ')"
                candidates="${found}"
              fi
            fi
            # 个人版 ACR：登录用户名有时就是命名空间，作为兜底候选
            if [ -z "${candidates}" ]; then
              if printf '%s' "$user" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
                candidates="${user}"
              else
                echo "::warning::ACR_USERNAME 含非法字符（不能是邮箱/中文），无法作为命名空间候选；请填 ACR「访问凭证」里的用户名"
              fi
            fi
          fi

          # 只保留格式合法的候选
          valid=""
          for c in ${candidates}; do
            if printf '%s' "$c" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
              valid="${valid} ${c}"
            else
              echo "跳过非法候选命名空间：${c}"
            fi
          done
          candidates="${valid# }"

          if [ -z "${candidates}" ]; then
            echo "::error::无法确定可用命名空间。请把 Secret ACR_REGISTRY 显式设为 <地址>/<命名空间>，例如 ${host}/erp"
            echo "::error::命名空间在 ACR 控制台左侧「命名空间」列表可见；个人版地址形如 crpi-xxxx.cn-<区域>.personal.cr.aliyuncs.com/<命名空间>"
            exit 1
          fi

          echo "host=${host}" >> "$GITHUB_OUTPUT"
          echo "candidates=${candidates}" >> "$GITHUB_OUTPUT"
          {
            echo "### ACR 配置"
            echo "- Registry  : ${host}"
            echo "- 命名空间候选 : ${candidates}"
            echo "- Tag       : ${ACR_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 预检 ACR 网络连通性
        env:
          ACR_HOST: ${{ steps.acr.outputs.host }}
        run: |
          set -uo pipefail
          # docker daemon 访问 ACR 偶发 TLS 握手超时（跨境网络抖动），先带重试地探测 /v2/
          ok=""
          for i in 1 2 3; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 30 "https://${ACR_HOST}/v2/" 2>&1)" && ok="$code" && break
            echo "第 ${i} 次探测 ${ACR_HOST} 失败：${code}"
            sleep $((i * 10))
          done
          if [ -z "${ok}" ]; then
            echo "::error::无法连接 ACR：${ACR_HOST}"
            echo "排查顺序："
            echo "1) 报 TLS handshake timeout 说明 runner 到 ACR 的网络不通或抖动，换更近 ACR 区域的 runner（自托管/国内节点）最直接"
            echo "2) 为 runner 配置 HTTPS_PROXY 后重试"
            echo "3) 确认 ACR 域名与凭证区域一致（凭证是区域级的，跨区域会超时或 denied）"
            exit 1
          fi
          echo "ACR /v2/ 探测结果：HTTP ${ok}（401 表示需要认证，属正常）"

      - name: 登录阿里云 ACR
        env:
          ACR_HOST: ${{ steps.acr.outputs.host }}
          ACR_USER: ${{ secrets.ACR_USERNAME }}
          DOCKER_CLIENT_TIMEOUT: 120
        run: |
          set -euo pipefail
          # 用户名可能带尾随换行（Secret 粘贴常见问题），登录前清洗
          user="$(printf '%s' "$ACR_USER" | tr -d '[:space:]')"
          echo "登录 ACR：host=${ACR_HOST}, 用户名长度=${#user}"
          # daemon 侧 TLS 握手超时属于网络抖动，重试即可自愈；连续失败才是配置问题
          for i in 1 2 3; do
            if printf '%s' "$ACR_PASSWORD" | tr -d '\r\n' | docker login "$ACR_HOST" --username "$user" --password-stdin; then
              echo "登录 ACR 成功"
              exit 0
            fi
            echo "登录失败（第 ${i} 次），$((i * 15)) 秒后重试 ..."
            sleep $((i * 15))
          done
          echo "::error::docker login 连续 3 次失败"
          echo "排查顺序：1) ACR_USERNAME 是否为「访问凭证」中的用户名；2) ACR_PASSWORD 是否正确/已过期；3) 网络或区域是否与 ACR 一致"
          exit 1

      - name: 预检镜像仓库是否可访问
        env:
          ACR_HOST: ${{ steps.acr.outputs.host }}
          CANDIDATES: ${{ steps.acr.outputs.candidates }}
        run: |
          set -uo pipefail
          for ns in ${CANDIDATES}; do
            for repo in erpa-backend erpa-frontend; do
              if docker manifest inspect "${ACR_HOST}/${ns}/${repo}:latest" >/dev/null 2>&1; then
                echo "OK   ${ACR_HOST}/${ns}/${repo}:latest 可读"
              else
                echo "WARN ${ACR_HOST}/${ns}/${repo}:latest 不可读（仓库尚未创建或无权限）"
              fi
            done
          done

      - name: 构建 backend 镜像
        env:
          ACR_TAG: ${{ env.ACR_TAG }}
        run: |
          set -euo pipefail
          docker build -t "erp-backend:${ACR_TAG}" ./backend

      - name: 构建 frontend 镜像
        env:
          ACR_TAG: ${{ env.ACR_TAG }}
        run: |
          set -euo pipefail
          docker build -t "erp-frontend:${ACR_TAG}" ./frontend

      - name: 推送 backend 镜像
        id: push-backend
        env:
          ACR_HOST: ${{ steps.acr.outputs.host }}
          CANDIDATES: ${{ steps.acr.outputs.candidates }}
          ACR_TAG: ${{ env.ACR_TAG }}
        run: |
          set -uo pipefail
          ok=""
          for ns in ${CANDIDATES}; do
            ref="${ACR_HOST}/${ns}/erpa-backend:${ACR_TAG}"
            echo "==> 尝试推送到 ${ref}"
            if ! docker tag "erp-backend:${ACR_TAG}" "${ref}"; then
              echo "打标签失败，跳过该候选"
              continue
            fi
            for attempt in 1 2 3; do
              push_out="$(docker push "${ref}" 2>&1)"
              if [ $? -eq 0 ]; then
                echo "$push_out" | tail -3
                ok="${ns}"
                break
              fi
              echo "推送失败（第 ${attempt} 次），原始报错："
              echo "$push_out" | tail -10
              if echo "$push_out" | grep -qiE 'toomanyrequests|429|rate limit'; then
                echo "疑似限流，30 秒后重试 ..."
                sleep 30
              else
                break
              fi
            done
            if [ -n "$ok" ]; then
              break
            fi
            echo "命名空间 ${ns} 推送失败，尝试下一个候选"
          done

          if [ -z "${ok}" ]; then
            echo "::error::所有候选命名空间推送失败（${CANDIDATES}）"
            echo "排查顺序："
            echo "1) ACR 控制台确认命名空间存在，且区域与 ${ACR_HOST} 一致（凭证是区域级的）"
            echo "2) 在该命名空间下手动创建镜像仓库 erpa-backend 与 erpa-frontend（ACR 不会在 docker push 时自动建仓库，仓库不存在即返回 denied）"
            echo "3) 确认 ACR_USERNAME 是 ACR 实例「访问凭证」里的用户名，不是 RAM 用户名"
            echo "4) 企业版实例：在 ACR「授权管理」给该账号授予该命名空间的 push/pull 权限"
            echo "5) 若以上都正常，请把 ACR_REGISTRY 显式设置为 <地址>/<命名空间>，避免探测歧义"
            exit 1
          fi

          echo "namespace=${ok}" >> "$GITHUB_OUTPUT"
          echo "推送成功：${ACR_HOST}/${ok}/erpa-backend:${ACR_TAG}"

      - name: 推送 frontend 镜像
        env:
          ACR_HOST: ${{ steps.acr.outputs.host }}
          NAMESPACE: ${{ steps.push-backend.outputs.namespace }}
          ACR_TAG: ${{ env.ACR_TAG }}
        run: |
          set -euo pipefail
          ref="${ACR_HOST}/${NAMESPACE}/erpa-frontend:${ACR_TAG}"
          docker tag "erp-frontend:${ACR_TAG}" "${ref}"
          push_out="$(docker push "${ref}" 2>&1)"
          if [ $? -ne 0 ]; then
            echo "推送失败，原始报错："
            echo "$push_out" | tail -10
            echo "::error::推送失败：${ref}"
            echo "排查方式与 backend 相同：命名空间 / 区域 / 仓库是否存在 / 推送权限 / 镜像体积是否超限"
            exit 1
          fi
          echo "$push_out" | tail -3
          echo "推送成功：${ref}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 先校验 SSH 相关 Secret：缺失或粘贴成公钥时直接给出明确指引，
      # 避免 ssh-action 只报 "ssh: no key found" 这类难以定位的错误
      - name: 校验部署密钥
        id: deploykey
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
        run: |
          # 刻意不加 -e：统一由 fail() 打印 ::error:: 后 exit 1，
          # 保证错误信息完整、退出码可控（加 -e 会在中途某条命令失败时直接中断）
          set -uo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ -n "${DEPLOY_HOST:-}" ] || fail "缺少 Secret DEPLOY_HOST（服务器 IP 或域名）"
          [ -n "${DEPLOY_USER:-}" ] || fail "缺少 Secret DEPLOY_USER（SSH 登录用户，如 root）"

          # SSH 端口：未配置默认 22；配置了必须是纯数字，避免把非法值传给 ssh-action
          port="$(printf '%s' "${DEPLOY_PORT:-22}" | tr -d '[:space:]')"
          if ! printf '%s' "$port" | grep -Eq '^[0-9]{1,5}$'; then
            fail "Secret DEPLOY_PORT 必须是纯数字（1-65535）"
          fi
          echo "port=${port}" >> "$GITHUB_OUTPUT"

          # 仓库地址：可用 Secret 覆盖，便于 fork / 迁移而无需改工作流
          repo="$(printf '%s' "${DEPLOY_REPO:-}" | tr -d '[:space:]')"
          [ -n "$repo" ] || repo="huqingyuan0707/ERP-System"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"

          # DEPLOY_REPO_TOKEN 可选；配置了就提示格式，降低填错概率
          if [ -n "${DEPLOY_REPO_TOKEN:-}" ]; then
            case "$DEPLOY_REPO_TOKEN" in
              ghp_*|github_pat_*) : ;;
              *) echo "::warning::Secret DEPLOY_REPO_TOKEN 格式可疑（应以 ghp_ 或 github_pat_ 开头）" ;;
            esac
          fi

          # 密码登录作为兜底：配置了 DEPLOY_PASSWORD 就不再要求私钥
          use_password=0
          if [ -n "${DEPLOY_PASSWORD:-}" ]; then
            use_password=1
            echo "检测到 Secret DEPLOY_PASSWORD，改用密码方式登录（跳过私钥校验）"
            echo "key_path=" >> "$GITHUB_OUTPUT"
            echo "use_password=1" >> "$GITHUB_OUTPUT"
          else
            echo "use_password=0" >> "$GITHUB_OUTPUT"
            [ -n "${DEPLOY_SSH_KEY:-}" ] || fail "缺少 Secret DEPLOY_SSH_KEY（填 SSH 私钥全文）或 DEPLOY_PASSWORD（服务器登录密码）"

            # 去掉复制粘贴可能带入的 CR 字符：CRLF 会让 Go 版 ssh 解析私钥失败（no key found）
            key="$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r')"
            # 兼容 base64 编码的私钥：Secret 中常这样保存多行私钥
            if ! printf '%s' "$key" | grep -q 'BEGIN .*PRIVATE KEY'; then
              decoded="$(printf '%s' "$key" | base64 -d 2>/dev/null | tr -d '\r' || true)"
              # 严格判定：首行必须是标准 PEM 私钥头，避免任意文本解码后被误认为私钥
              if printf '%s' "$decoded" | grep -qE '^-----BEGIN (OPENSSH|RSA|EC|DSA|ENCRYPTED)? ?PRIVATE KEY-----$'; then
                key="$decoded"
                echo "检测到 base64 编码的私钥，已自动解码"
              fi
            fi
            if ! printf '%s' "$key" | grep -qE '^-----BEGIN (OPENSSH|RSA|EC|DSA|ENCRYPTED)? ?PRIVATE KEY-----$'; then
              echo "::error::DEPLOY_SSH_KEY 不是可识别的 SSH 私钥"
              # 只输出布尔结论，绝不打印私钥片段（避免日志泄露）
              echo "检测结论：以 -----BEGIN 开头=$(printf '%s' "$key" | grep -c '^-----BEGIN' || true)；像公钥(ssh-开头)=$(printf '%s' "$key" | grep -c '^ssh-' || true)；内容长度=${#key}"
              echo "支持的格式：OpenSSH（-----BEGIN OPENSSH PRIVATE KEY-----）、PKCS#8（-----BEGIN PRIVATE KEY-----）、RSA（-----BEGIN RSA PRIVATE KEY-----）"
              echo "常见原因：1) 误填 .pub 公钥（内容形如 ssh-ed25519 AAAA...）；2) 填了 PuTTY 格式（PuTTY-User-Key-File-2:），需换 OpenSSH 格式；3) 只复制了公钥或私钥被截断"
              echo "替代方案：配置 Secret DEPLOY_PASSWORD 改用密码登录"
              exit 1
            fi
            # 私钥必须完整：同时校验结尾标记，避免只粘贴首行导致解析失败
            if ! printf '%s' "$key" | grep -q 'END .*PRIVATE KEY'; then
              echo "::error::DEPLOY_SSH_KEY 内容不完整：未找到 END ... PRIVATE KEY 结尾标记"
              echo "请确认粘贴的是完整私钥（需同时包含 BEGIN 与 END 两行及中间内容）"
              exit 1
            fi
            # 去掉开头所有空行（多行私钥以空行开头同样会导致解析失败）
            key="$(printf '%s\n' "$key" | awk 'NF{p=1} p')"

            # 逐行标记为敏感，确保后续任何日志输出都不会泄露私钥内容
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::add-mask::$line"
              fi
            done <<< "$key"

            # 私钥写入运行器临时文件（600）并通过 key_path 传给 SSH 步骤；
            # 不写入 $GITHUB_ENV，避免私钥进入后续所有步骤的全局环境变量
            key_file="${RUNNER_TEMP}/deploy_ssh_key"
            printf '%s\n' "$key" > "$key_file"
            chmod 600 "$key_file"
            echo "key_path=${key_file}" >> "$GITHUB_OUTPUT"

            {
              echo "### 部署密钥校验"
              echo "- DEPLOY_HOST : 已配置"
              echo "- DEPLOY_USER : 已配置"
              echo "- SSH 端口   : ${port}"
              echo "- 认证方式   : 私钥（长度 ${#key}）"
              echo "- 目标仓库   : ${repo}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 凭证先在 CI 侧做 base64（base64 只含安全字符），避免密码里的特殊字符破坏远端 shell 脚本；
      # 结果写入 step output 而非 $GITHUB_ENV，避免敏感值进入后续所有步骤的全局环境变量
      - name: 编码服务器端所需配置
        id: enc
        run: |
          set -uo pipefail
          b64_registry="$(printf '%s' "$ACR_REGISTRY" | base64 -w0)"
          b64_user="$(printf '%s' "$ACR_USERNAME" | base64 -w0)"
          b64_pass="$(printf '%s' "$ACR_PASSWORD" | base64 -w0)"
          b64_token="$(printf '%s' "$DEPLOY_REPO_TOKEN" | base64 -w0)"
          # 掩码：即使意外被打印也不会泄露真实值
          for v in "$b64_user" "$b64_pass" "$b64_token"; do
            if [ -n "$v" ]; then
              echo "::add-mask::$v"
            fi
          done
          {
            echo "acr_registry_b64=${b64_registry}"
            echo "acr_user_b64=${b64_user}"
            echo "acr_pass_b64=${b64_pass}"
            # 未配置 token 时不写该输出，远端按“未配置”分支处理
            # 注意：这里必须用 if 而不是 `[ -n ... ] && echo`，因为 CI 默认用 `bash -e`，
            # 条件为假时整条命令返回 1，会让步骤直接失败
            if [ -n "$b64_token" ]; then
              echo "deploy_repo_token_b64=${b64_token}"
            fi
          } >> "$GITHUB_OUTPUT"
        env:
          ACR_REGISTRY: ${{ needs.build-and-push.outputs.host }}/${{ needs.build-and-push.outputs.namespace }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}

      - name: SSH 登录服务器并拉取运行
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # 私钥通过文件路径传递（校验步骤写入的 600 临时文件），不进入环境变量；
          # 认证方式二选一：配置了密码就不传私钥，避免 action 同时拿到两套凭据
          key_path: ${{ steps.deploykey.outputs.key_path }}
          password: ${{ steps.deploykey.outputs.use_password == '1' && secrets.DEPLOY_PASSWORD || '' }}
          port: ${{ steps.deploykey.outputs.port }}
          script: |
            set -euo pipefail
            # 明确关闭调试回显，避免 set -x 把 token/密码打进日志
            set +x
            # 首次部署可能还没有代码目录：配置了 DEPLOY_REPO_TOKEN 时自动克隆，否则给出明确指引
            repo_token="$(printf '%s' '${{ steps.enc.outputs.deploy_repo_token_b64 }}' | base64 -d 2>/dev/null | tr -d '\r\n' || true)"
            repo_slug='${{ steps.deploykey.outputs.repo }}'
            if [ ! -d /root/erp ]; then
              if [ -n "$repo_token" ]; then
                echo "服务器上不存在 /root/erp，正在用 DEPLOY_REPO_TOKEN 克隆仓库 ${repo_slug} ..."
                # token 不写进 URL 与命令行参数：写入 600 权限的临时凭据文件，克隆后立即删除
                umask 077
                cred_file="$(mktemp)"
                trap 'rm -f "$cred_file"' EXIT
                printf 'https://x-access-token:%s@github.com\n' "$repo_token" > "$cred_file"
                # 不使用 --depth 浅克隆：update.sh 需要 fetch + reset --hard 拉取远端最新提交
                git -c "credential.helper=store --file=${cred_file}" clone "https://github.com/${repo_slug}.git" /root/erp
                # 远程 URL 不含 token：token 只存在于临时凭据文件（退出时删除）
                git -C /root/erp remote set-url origin "https://github.com/${repo_slug}.git"
                rm -f "$cred_file"
                trap - EXIT
              else
                echo "错误：服务器上不存在 /root/erp 目录。请先在服务器上把仓库克隆到该目录，或配置 Secret DEPLOY_REPO_TOKEN 让流水线自动克隆"
                exit 1
              fi
            fi
            cd /root/erp
            registry="$(printf '%s' '${{ steps.enc.outputs.acr_registry_b64 }}' | base64 -d | tr -d '[:space:]')"
            username="$(printf '%s' '${{ steps.enc.outputs.acr_user_b64 }}' | base64 -d | tr -d '[:space:]')"
            password="$(printf '%s' '${{ steps.enc.outputs.acr_pass_b64 }}' | base64 -d | tr -d '\r\n')"
            echo "服务器端 ACR 配置：registry=${registry}, 用户名长度=${#username}, 密码长度=${#password}"

            # ACR_REGISTRY 非敏感：写进 .env，供 docker-compose 拼出镜像名
            if grep -q '^ACR_REGISTRY=' .env; then
              sed -i "s|^ACR_REGISTRY=.*|ACR_REGISTRY=${registry}|" .env
            else
              echo "ACR_REGISTRY=${registry}" >> .env
            fi

            # 镜像 tag 也要写进 .env：compose 用它决定拉哪个 tag，
            # 不写就会用默认 latest，与本次流水线推送的 tag 不一致导致拉不到镜像
            for kv in "BACKEND_IMAGE_TAG=${{ env.ACR_TAG }}" "FRONTEND_IMAGE_TAG=${{ env.ACR_TAG }}"; do
              k="${kv%%=*}"; v="${kv#*=}"
              if grep -q "^${k}=" .env; then
                sed -i "s|^${k}=.*|${k}=${v}|" .env
              else
                echo "${k}=${v}" >> .env
              fi
            done

            # 凭证单独放 .acr.env（600 权限），不进入 .env，避免被 compose 注入到容器
            umask 077
            cat > .acr.env <<EOF
            ACR_REGISTRY=${registry}
            ACR_USERNAME=${username}
            ACR_PASSWORD=${password}
            EOF
            sed -i 's/^[[:space:]]*//' .acr.env
            chmod 600 .acr.env

            bash scripts/update.sh
