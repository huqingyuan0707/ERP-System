# pytype 静态类型检查配置（Google 体系）
#
# 【重要】pytype 的配置文件有三种写法，本文件用的是 INI 风格：
#   - INI 风格：文件内写 [pytype] 段（本文件）
#   - TOML 风格：文件内写 [tool.pytype] 段
#   - 若不显式传 --config，pytype 只会向上查找 pyproject.toml / setup.cfg，
#     **不会**自动发现本 pytype.cfg，因此 CI 必须显式指定 --config=backend/pytype.cfg
#
# 【运行环境硬约束（务必阅读）】
#   pytype 2024.10.11 只支持 Python 3.8 ~ 3.12 解释器，且官方声明
#   「Windows is currently not supported unless you use WSL」。
#   结论：
#     - CI（Linux 容器 + Python 3.11）：可运行 pytype，作为门禁强制项；
#     - 本地 Windows 开发机：无法运行 pytype，只能跑 pyink + pylint；
#     - 本地需要跑 pytype 时请使用 WSL 或 docker（见落地方案文档「本地补跑」一节）。
#   本仓库 CI 的 Python 版本请固定为 3.11，不要用 3.12+，否则 pytype 直接装不上。

[pytype]
# 待检查的代码范围：整个后端应用包
inputs = app

# 模拟的目标 Python 版本：与 pyproject.toml 的 py311 一致
python_version = 3.11

# 源码搜索路径：让 pytype 能解析到 app 包内的相互引用
pythonpath = .

# 并行任务数：CI 机器一般 2~4 核，4 足够；填 auto 会取 CPU 核数
jobs = 4

# 遇到错误继续往下跑，保证一次运行能报出全部问题，而不是只报第一个
keep_going = True

# 输出目录：pytype 的中间产物（.pyi 等），供后续增量复用
output = .pytype

# 排除目录：测试代码与迁移脚本不参与类型门禁
exclude = tests alembic

# ------------------------------------------------------------------
# 屏蔽的错误类型（disable）
#
# 原则：只屏蔽「工具自身误报」或「与本项目技术栈强相关且无法消除」的错误，
#       凡是可能掩盖真实类型错误的，一律不屏蔽。
#
#   import-error         : pytype 解析 FastAPI/SQLAlchemy 2.0 的运行时元数据时，
#                            常把动态生成的对象当成缺失模块，属于误报。
#                            注意：本项目自身的模块缺失（自己写的 import 写错）已由
#                            pylint 的 E0401 与单元测试的 ImportError 覆盖，不会漏。
#   pyi-error            : 类型存根(stub)自身与运行时不符，属于 typeshed 版本问题。
#   module-attr          : 与 import-error 同源，动态模块属性误报。
#   bad-return-type      : FastAPI 依赖注入下返回值类型被推断为 Any，
#                            在 @router 装饰器包装后推断不可靠。
#   wrong-arg-types      : **不屏蔽**。这是「非法调用」的核心检测项，
#                            直接对应 ERP 财务/库存数据的传参错误，必须保留。
#   attribute-error      : **不屏蔽**。这是「空引用 / 属性不存在」的核心检测项，
#                            正好能命中本次实测发现的
#                            SysPermission.tenant_id 缺失这类真实缺陷。
# ------------------------------------------------------------------
disable = import-error,pyi-error,module-attr,bad-return-type
