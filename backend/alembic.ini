[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# NOTE: keep this file ASCII-only (configparser reads it with the OS locale encoding).
# The real URL is injected from app.core.config.settings in alembic/env.py.
# Only a placeholder lives here; real DB credentials come from .env, never from the repo.
sqlalchemy.url = postgresql+asyncpg://erp:change_me@127.0.0.1:5432/erp

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
